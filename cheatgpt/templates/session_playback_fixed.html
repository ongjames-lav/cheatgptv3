{% extends "base.html" %}

{% block content %}
<div id="session-playback-container">
    <div class="playback-header">
        <h2>Session Playback</h2>
        <div class="session-info">
            <span id="session-id">{{ session_id }}</span>
            <span id="session-duration">Duration: {{ duration }}s</span>
            <span id="total-events">Events: {{ total_events }}</span>
        </div>
    </div>

    <div class="video-player-container">
        <!-- Main Video Player -->
        <div class="video-wrapper">
            <video id="main-video" controls preload="auto" crossorigin="anonymous">
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <!-- Event Overlay Display -->
            <div id="event-overlay" class="event-overlay">
                <div id="event-label" class="event-label"></div>
            </div>
        </div>

        <!-- Custom Controls -->
        <div class="video-controls">
            <button id="play-pause-btn" class="control-btn">
                <span class="play-icon">▶</span>
                <span class="pause-icon" style="display: none;">⏸</span>
            </button>
            <button id="backward-btn" class="control-btn">⏪</button>
            <button id="forward-btn" class="control-btn">⏩</button>
            <div class="time-display">
                <span id="current-time">00:00</span> / <span id="total-time">00:00</span>
            </div>
            <button id="fullscreen-btn" class="control-btn">⛶</button>
        </div>

        <!-- Timeline with Hotspot Markers -->
        <div class="timeline-container">
            <div class="timeline-bar" id="timeline-bar">
                <div class="progress-bar" id="progress-bar"></div>
                <div class="timeline-markers" id="timeline-markers">
                    <!-- Hotspot markers will be dynamically inserted here -->
                </div>
                <div class="timeline-handle" id="timeline-handle"></div>
            </div>
            <div class="timeline-labels">
                <span class="timeline-start">0:00</span>
                <span class="timeline-end" id="timeline-end">{{ duration_formatted }}</span>
            </div>
        </div>
    </div>

    <!-- Event Details Panel -->
    <div class="events-panel">
        <h3>Detected Events</h3>
        <div id="events-list" class="events-list">
            <!-- Events will be populated by JavaScript -->
        </div>
    </div>
</div>

<style>
#session-playback-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.playback-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 8px;
}

.session-info {
    display: flex;
    gap: 20px;
    font-size: 14px;
    color: #666;
}

.video-player-container {
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
}

.video-wrapper {
    position: relative;
    width: 100%;
}

#main-video {
    width: 100%;
    height: auto;
    display: block;
}

.event-overlay {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    pointer-events: none;
}

.event-label {
    background: rgba(255, 0, 0, 0.9);
    color: white;
    padding: 8px 12px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 14px;
    display: none;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.6; }
}

.video-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px;
    background: #222;
    color: white;
}

.control-btn {
    background: #444;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s;
}

.control-btn:hover {
    background: #666;
}

.time-display {
    margin-left: auto;
    font-family: monospace;
    font-size: 14px;
}

.timeline-container {
    padding: 20px;
    background: #333;
}

.timeline-bar {
    position: relative;
    width: 100%;
    height: 20px;
    background: #555;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 10px;
}

.progress-bar {
    height: 100%;
    background: #ff4444;
    border-radius: 10px;
    width: 0%;
    transition: width 0.1s;
}

.timeline-markers {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.hotspot-marker {
    position: absolute;
    top: -5px;
    width: 12px;
    height: 30px;
    background: #ff0000;
    border: 2px solid #fff;
    border-radius: 6px;
    cursor: pointer;
    z-index: 5;
    transition: transform 0.2s;
}

.hotspot-marker:hover {
    transform: scale(1.2);
}

.hotspot-marker.suspicious-gesture {
    background: #ff00ff;
}

.hotspot-marker.suspicious-looking {
    background: #ffa500;
}

.hotspot-marker.suspicious-lean {
    background: #ffff00;
}

.hotspot-marker.phone-detected {
    background: #ff0000;
}

.timeline-handle {
    position: absolute;
    top: -5px;
    width: 4px;
    height: 30px;
    background: #fff;
    border-radius: 2px;
    left: 0%;
    cursor: pointer;
    z-index: 10;
}

.timeline-labels {
    display: flex;
    justify-content: space-between;
    color: #ccc;
    font-size: 12px;
    font-family: monospace;
}

.events-panel {
    background: #f9f9f9;
    border-radius: 8px;
    padding: 20px;
}

.events-list {
    max-height: 300px;
    overflow-y: auto;
}

.event-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin: 5px 0;
    background: white;
    border-radius: 4px;
    border-left: 4px solid #ccc;
    cursor: pointer;
    transition: background 0.2s;
}

.event-item:hover {
    background: #f0f0f0;
}

.event-item.suspicious-gesture {
    border-left-color: #ff00ff;
}

.event-item.suspicious-looking {
    border-left-color: #ffa500;
}

.event-item.suspicious-lean {
    border-left-color: #ffff00;
}

.event-item.phone-detected {
    border-left-color: #ff0000;
}

.event-time {
    font-family: monospace;
    font-weight: bold;
    color: #666;
}

.event-type {
    font-weight: bold;
    text-transform: capitalize;
}

.event-confidence {
    font-size: 12px;
    color: #888;
}

/* Responsive Design */
@media (max-width: 768px) {
    .playback-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .session-info {
        flex-direction: column;
        gap: 5px;
    }

    .video-controls {
        flex-wrap: wrap;
        gap: 5px;
    }
}
</style>

<script>
// Session and timeline data - these would typically be passed from the backend
const SESSION_DATA = {
    sessionId: '{{ session_id }}',
    videoPath: '{{ video_path }}',
    duration: {{ duration }},
    startTime: {{ start_time }},
    events: {{ events|tojsonfilter|safe }}
};

// Debug logging
console.log('SESSION_DATA:', SESSION_DATA);
console.log('Video path:', SESSION_DATA.videoPath);

class SessionPlayback {
    constructor() {
        this.video = document.getElementById('main-video');
        this.playPauseBtn = document.getElementById('play-pause-btn');
        this.backwardBtn = document.getElementById('backward-btn');
        this.forwardBtn = document.getElementById('forward-btn');
        this.fullscreenBtn = document.getElementById('fullscreen-btn');
        this.currentTimeSpan = document.getElementById('current-time');
        this.totalTimeSpan = document.getElementById('total-time');
        this.timelineBar = document.getElementById('timeline-bar');
        this.progressBar = document.getElementById('progress-bar');
        this.timelineHandle = document.getElementById('timeline-handle');
        this.timelineMarkers = document.getElementById('timeline-markers');
        this.eventOverlay = document.getElementById('event-overlay');
        this.eventLabel = document.getElementById('event-label');
        this.eventsList = document.getElementById('events-list');
        
        this.isDragging = false;
        this.events = SESSION_DATA.events || [];
        
        // Debug video element
        console.log('Video element:', this.video);
        console.log('Video src before setting:', this.video.src);
        
        // Set the video source explicitly
        if (SESSION_DATA.videoPath) {
            this.video.src = SESSION_DATA.videoPath;
            console.log('Video src set to:', SESSION_DATA.videoPath);
        } else {
            console.error('No video path available in SESSION_DATA');
        }
        
        console.log('Video readyState:', this.video.readyState);
        
        this.init();
    }
    
    init() {
        this.setupEventListeners();
        this.populateEvents();
        
        // Wait for video metadata to load before creating markers
        this.video.addEventListener('loadedmetadata', () => {
            console.log('Video metadata loaded. Duration:', this.video.duration);
            this.updateTotalTime();
            this.createHotspotMarkers();
        });
        
        // Handle video loading errors
        this.video.addEventListener('error', (e) => {
            console.error('Video loading error:', e.target.error);
            const errorMsg = 'Video loading failed. Please check if the video file exists and is accessible.';
            console.error(errorMsg);
            this.showErrorMessage(errorMsg);
        });
        
        // Handle video ready state changes
        this.video.addEventListener('canplay', () => {
            console.log('Video is ready to play');
        });
        
        // Handle video loading progress
        this.video.addEventListener('loadstart', () => {
            console.log('Video loading started');
        });
        
        this.video.addEventListener('loadeddata', () => {
            console.log('Video data loaded');
        });
        
        // Force video to load
        this.video.load();
    }
    
    setupEventListeners() {
        // Video events
        this.video.addEventListener('timeupdate', () => this.updateProgress());
        this.video.addEventListener('ended', () => this.onVideoEnded());
        
        // Control buttons
        this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
        this.backwardBtn.addEventListener('click', () => this.skipBackward());
        this.forwardBtn.addEventListener('click', () => this.skipForward());
        this.fullscreenBtn.addEventListener('click', () => this.toggleFullscreen());
        
        // Timeline interactions
        this.timelineBar.addEventListener('click', (e) => this.seekToPosition(e));
        this.timelineHandle.addEventListener('mousedown', (e) => this.startDragging(e));
        document.addEventListener('mousemove', (e) => this.handleDragging(e));
        document.addEventListener('mouseup', () => this.stopDragging());
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => this.handleKeyboard(e));
    }
    
    togglePlayPause() {
        if (this.video.paused) {
            // Check if video is loaded and ready
            if (this.video.readyState >= 3) { // HAVE_FUTURE_DATA or higher
                const playPromise = this.video.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('Video started playing');
                        this.playPauseBtn.querySelector('.play-icon').style.display = 'none';
                        this.playPauseBtn.querySelector('.pause-icon').style.display = 'inline';
                    }).catch((error) => {
                        console.error('Play failed:', error);
                        this.showErrorMessage('Failed to play video: ' + error.message);
                    });
                }
            } else {
                console.log('Video not ready, readyState:', this.video.readyState);
                this.showErrorMessage('Video is still loading, please wait...');
            }
        } else {
            this.video.pause();
            this.playPauseBtn.querySelector('.play-icon').style.display = 'inline';
            this.playPauseBtn.querySelector('.pause-icon').style.display = 'none';
        }
    }
    
    skipBackward() {
        if (this.video.duration && !isNaN(this.video.duration)) {
            this.video.currentTime = Math.max(0, this.video.currentTime - 10);
        }
    }
    
    skipForward() {
        if (this.video.duration && !isNaN(this.video.duration)) {
            this.video.currentTime = Math.min(this.video.duration, this.video.currentTime + 10);
        }
    }
    
    toggleFullscreen() {
        if (!document.fullscreenElement) {
            this.video.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
    
    updateProgress() {
        if (!this.isDragging && this.video.duration && !isNaN(this.video.duration) && this.video.duration > 0) {
            const progress = (this.video.currentTime / this.video.duration) * 100;
            this.progressBar.style.width = progress + '%';
            this.timelineHandle.style.left = progress + '%';
            this.updateCurrentTime();
            this.checkForEvents();
        }
    }
    
    updateCurrentTime() {
        if (!isNaN(this.video.currentTime)) {
            this.currentTimeSpan.textContent = this.formatTime(this.video.currentTime);
        }
    }
    
    updateTotalTime() {
        if (this.video.duration && !isNaN(this.video.duration)) {
            this.totalTimeSpan.textContent = this.formatTime(this.video.duration);
        }
    }
    
    formatTime(seconds) {
        if (isNaN(seconds) || seconds === null || seconds === undefined) {
            return '00:00';
        }
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }
    
    seekToPosition(e) {
        if (this.video.duration && !isNaN(this.video.duration) && this.video.duration > 0) {
            const rect = this.timelineBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            this.video.currentTime = pos * this.video.duration;
        }
    }
    
    startDragging(e) {
        this.isDragging = true;
        e.preventDefault();
    }
    
    handleDragging(e) {
        if (this.isDragging && this.video.duration && !isNaN(this.video.duration) && this.video.duration > 0) {
            const rect = this.timelineBar.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            this.video.currentTime = pos * this.video.duration;
            this.progressBar.style.width = (pos * 100) + '%';
            this.timelineHandle.style.left = (pos * 100) + '%';
        }
    }
    
    stopDragging() {
        this.isDragging = false;
    }
    
    handleKeyboard(e) {
        switch(e.code) {
            case 'Space':
                e.preventDefault();
                this.togglePlayPause();
                break;
            case 'ArrowLeft':
                this.skipBackward();
                break;
            case 'ArrowRight':
                this.skipForward();
                break;
            case 'KeyF':
                this.toggleFullscreen();
                break;
        }
    }
    
    createHotspotMarkers() {
        // Only create markers if we have a valid duration
        if (!SESSION_DATA.duration || SESSION_DATA.duration <= 0) {
            console.log('No valid duration for creating markers');
            return;
        }
        
        console.log('Creating hotspot markers for', this.events.length, 'events');
        
        this.events.forEach((event, index) => {
            const relativeTime = event.timestamp - SESSION_DATA.startTime;
            
            // Skip events that are outside the video duration
            if (relativeTime < 0 || relativeTime > SESSION_DATA.duration) {
                console.log('Skipping event outside duration:', relativeTime);
                return;
            }
            
            const position = (relativeTime / SESSION_DATA.duration) * 100;
            
            const marker = document.createElement('div');
            marker.className = `hotspot-marker ${event.event_type.replace('_', '-')}`;
            marker.style.left = position + '%';
            marker.title = `${event.event_type.replace('_', ' ')} at ${this.formatTime(relativeTime)}`;
            
            marker.addEventListener('click', () => {
                if (this.video.duration && !isNaN(this.video.duration)) {
                    this.video.currentTime = relativeTime;
                    this.showEventLabel(event);
                }
            });
            
            marker.addEventListener('mouseenter', () => {
                this.showEventLabel(event);
            });
            
            marker.addEventListener('mouseleave', () => {
                this.hideEventLabel();
            });
            
            this.timelineMarkers.appendChild(marker);
        });
    }
    
    populateEvents() {
        this.eventsList.innerHTML = '';
        
        this.events.forEach((event, index) => {
            const relativeTime = event.timestamp - SESSION_DATA.startTime;
            const eventItem = document.createElement('div');
            eventItem.className = `event-item ${event.event_type.replace('_', '-')}`;
            
            eventItem.innerHTML = `
                <div>
                    <div class="event-type">${event.event_type.replace('_', ' ')}</div>
                    <div class="event-confidence">Confidence: ${(event.confidence * 100).toFixed(1)}%</div>
                </div>
                <div class="event-time">${this.formatTime(relativeTime)}</div>
            `;
            
            eventItem.addEventListener('click', () => {
                if (this.video.duration && !isNaN(this.video.duration)) {
                    const targetTime = relativeTime;
                    console.log('Seeking to time:', targetTime);
                    this.video.currentTime = targetTime;
                    this.showEventLabel(event);
                    
                    // If video is paused, play it
                    if (this.video.paused) {
                        this.togglePlayPause();
                    }
                } else {
                    this.showErrorMessage('Video not ready for seeking');
                }
            });
            
            this.eventsList.appendChild(eventItem);
        });
        
        if (this.events.length === 0) {
            this.eventsList.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No events detected in this session</div>';
        }
    }
    
    checkForEvents() {
        const currentTime = this.video.currentTime;
        const currentEvent = this.events.find(event => {
            const relativeTime = event.timestamp - SESSION_DATA.startTime;
            return Math.abs(currentTime - relativeTime) < 1; // 1 second tolerance
        });
        
        if (currentEvent) {
            this.showEventLabel(currentEvent);
        } else {
            this.hideEventLabel();
        }
    }
    
    showEventLabel(event) {
        this.eventLabel.textContent = `⚠️ ${event.event_type.replace('_', ' ').toUpperCase()}`;
        this.eventLabel.className = `event-label ${event.event_type.replace('_', '-')}`;
        this.eventLabel.style.display = 'block';
    }
    
    hideEventLabel() {
        this.eventLabel.style.display = 'none';
    }
    
    showErrorMessage(message) {
        // Create or update error message div
        let errorDiv = document.getElementById('error-message');
        if (!errorDiv) {
            errorDiv = document.createElement('div');
            errorDiv.id = 'error-message';
            errorDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #ff4444;
                color: white;
                padding: 15px;
                border-radius: 5px;
                z-index: 1000;
                max-width: 300px;
            `;
            document.body.appendChild(errorDiv);
        }
        errorDiv.textContent = message;
        
        // Auto-hide after 5 seconds
        setTimeout(() => {
            if (errorDiv.parentNode) {
                errorDiv.parentNode.removeChild(errorDiv);
            }
        }, 5000);
    }
    
    onVideoEnded() {
        this.playPauseBtn.querySelector('.play-icon').style.display = 'inline';
        this.playPauseBtn.querySelector('.pause-icon').style.display = 'none';
    }
}

// Initialize the playback system when the page loads
document.addEventListener('DOMContentLoaded', () => {
    new SessionPlayback();
});
</script>
{% endblock %}
